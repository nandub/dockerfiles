name: arch-pkgbuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'arch-pkgbuild/**'
      - '.github/workflows/arch-pkgbuild.yml'
  pull_request:
    paths:
      - 'arch-pkgbuild/**'
      - '.github/workflows/arch-pkgbuild.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        shell: pwsh
        working-directory: arch-pkgbuild
        run: ./scripts/Invoke-ShellCheck.ps1

      - name: Build images and run smoke package
        shell: pwsh
        working-directory: arch-pkgbuild
        run: ./scripts/Test-ArchPkgbuild.ps1

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish full image
        uses: docker/build-push-action@v6
        with:
          context: ./arch-pkgbuild
          push: true
          tags: nandub/arch-pkgbuild:latest

      - name: Publish plain image
        uses: docker/build-push-action@v6
        with:
          context: ./arch-pkgbuild
          file: ./arch-pkgbuild/Dockerfile.plain
          push: true
          tags: nandub/arch-pkgbuild:plain
